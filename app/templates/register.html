{% extends "base.html" %}

{% block title %}Register - HealthApp{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 class="card-title text-center">Create an Account</h2>
    
    <div id="errorMsg" style="color: var(--danger-color); margin-bottom: 1rem; text-align: center; display: none;"></div>
    
    <form id="registerForm">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="role">I am a...</label>
            <select id="role" class="form-control">
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
    </form>
    <p class="text-center mt-4">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const name = document.getElementById('name').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const errorMsg = document.getElementById('errorMsg');
        
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, name, password, role })
            });
            
            if (res.ok) {
                // Registration successful, log them in immediately
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (loginRes.ok) {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/login';
                }
            } else {
                const data = await res.json();
                errorMsg.textContent = data.error || 'Registration failed';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = 'Network error occurred';
            errorMsg.style.display = 'block';
        }
    });
</script>
{% endblock %}
